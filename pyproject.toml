[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qdrant-sparse-finetune"
version = "0.1.0"
description = "Fine-tune SPLADE sparse embeddings for any product catalog with ANCE hard negative mining via Qdrant"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "sentence-transformers>=5.0",
    "qdrant-client>=1.9",
    "datasets>=2.14",
    "pydantic-settings>=2.0",
    "click>=8.0",
    "pandas>=2.0",
    "tqdm",
    "numpy",
    "torch>=2.0,<2.7",
    "transformers>=4.40",
    "pyyaml",
    "litellm>=1.0",
    "rich>=13.0",
    "accelerate>=1.1.0",
    "requests>=2.28",
    "python-dotenv>=1.0",
    "huggingface-hub>=0.20",
    "modal>=1.3.2",
]

[project.scripts]
qdrant-finetune = "qdrant_finetune.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/qdrant_finetune"]

[tool.ruff]
line-length = 100
